name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_MODE: "true"
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium

      - name: Lint backend
        working-directory: backend
        run: .venv/bin/ruff check app tests && .venv/bin/ruff format --check app tests
      - name: Lint frontend
        working-directory: frontend
        run: npx eslint . && npx prettier --check "src/**/*.{ts,tsx,css}" "e2e/**/*.ts"
      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Backend unit + API tests
        working-directory: backend
        run: .venv/bin/pytest
      - name: Frontend tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npx vite build
      - name: E2E (TEST_MODE, no Ollama)
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  # The documented one-command path (run.py / start.bat), exactly as a new user runs it, on Windows and macOS.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      TEST_MODE: "true"
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checkout keeps LF line endings (except .bat)
        shell: bash
        run: "! git ls-files --eol | grep -v '\\.bat$' | grep 'w/crlf'"
      - name: Install + backend and frontend tests
        run: python run.py test
      - name: Build
        working-directory: frontend
        run: npx vite build
      - name: Start the app (smoke test)
        run: python run.py --smoke
